<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Who Does What?</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#FFF8EC;--fg:#1F2A44;--panel:#FFFFFF;--line:#E4DED2;--or:#FF8A3D;--te:#2BB5A0;--ye:#FFD23F;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1F2A44;--fg:#FFF8EC;--panel:#2C3A5C;--line:#40507A}}
:root[data-theme="dark"]{--bg:#1F2A44;--fg:#FFF8EC;--panel:#2C3A5C;--line:#40507A}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:'Baloo 2','Trebuchet MS',system-ui,sans-serif;min-height:100vh}
#app{max-width:1000px;margin:0 auto;padding:14px 14px 28px;display:flex;flex-direction:column;gap:12px}
header{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
h1{margin:0;font-size:clamp(26px,4.6vw,44px);font-weight:800;line-height:1.1}
#hint{margin:0;font-size:clamp(16px,2.6vw,26px);font-weight:700;max-width:640px}
#side{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
#stars{font-size:34px;letter-spacing:3px}
#stage{display:flex;gap:18px;justify-content:center;align-items:flex-start;flex-direction:column;align-items:center}
.panel{background:var(--panel);color:var(--fg);border:4px solid var(--fg);border-radius:24px;padding:14px 16px;display:flex;flex-direction:column;align-items:center;gap:10px;width:100%;max-width:820px}
.panel h3{margin:0;font-size:clamp(16px,2.6vw,24px);font-weight:800}
.job{display:flex;align-items:center;gap:16px;font-size:clamp(26px,5.6vw,52px);font-weight:800;text-align:center}
.job .e{font-size:clamp(56px,12vw,110px);line-height:1}
.count{font-size:clamp(16px,2.6vw,22px);font-weight:700}
.bins{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;width:100%;max-width:820px}
.bin{flex:1 1 200px;display:flex;flex-direction:column;align-items:center;gap:4px;padding:14px 10px;border-radius:28px;border:4px solid #1F2A44;color:#1F2A44;font:inherit;cursor:pointer;box-shadow:0 6px 0 rgba(31,42,68,.3);touch-action:manipulation}
.bin .e{font-size:clamp(40px,8vw,64px);line-height:1}
.bin b{font-size:clamp(22px,4vw,34px);font-weight:800}
.bin span.d{font-size:clamp(15px,2.6vw,20px);font-weight:600}
.bin.hint{animation:pulse .7s infinite alternate;outline:4px solid #2BB5A0}
.shake{animation:shake .35s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@keyframes pulse{from{transform:scale(1)}to{transform:scale(1.06)}}
@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.1)}100%{transform:scale(1)}}
.win .job{animation:pop .5s}
.scr{position:relative;width:100%;max-width:780px;aspect-ratio:16/10;border:8px solid var(--fg);border-radius:20px;overflow:hidden;background:linear-gradient(135deg,#3A86FF,#2BB5A0);color:#1F2A44}
.ico{position:absolute;display:flex;flex-direction:column;align-items:center;font-size:clamp(11px,2.2vw,16px);font-weight:700;color:#FFF8EC}
.ico span{font-size:clamp(28px,6vw,48px);line-height:1}
.tb{position:absolute;left:0;right:0;bottom:0;height:13%;min-height:38px;background:rgba(31,42,68,.92);display:flex;align-items:center;padding:0 8px;gap:8px}
.tb .clk{margin-left:auto;color:#FFF8EC;font-weight:700;font-size:clamp(12px,2.4vw,18px)}
#st{font-size:clamp(14px,2.8vw,22px);padding:4px 14px;background:var(--ye);box-shadow:none;border-radius:10px}
.menu{position:absolute;left:8px;bottom:calc(13% + 6px);bottom:max(calc(13% + 6px),44px);background:#FFF8EC;border:4px solid #1F2A44;border-radius:16px;padding:8px;display:flex;flex-direction:column;gap:6px;min-width:min(260px,70%)}
.menu h4{margin:0;font-size:clamp(14px,2.6vw,20px);text-align:center}
.mi{font-size:clamp(14px,2.8vw,22px);padding:6px 12px;background:#fff;color:#1F2A44;border:3px solid #1F2A44;border-radius:10px;box-shadow:none;text-align:left}
.mi.hint,#st.hint{animation:pulse .7s infinite alternate;outline:4px solid #2BB5A0}
.off{position:absolute;inset:0;background:#000;color:#FFF8EC;display:flex;align-items:center;justify-content:center;text-align:center;font-size:clamp(20px,4.6vw,40px);font-weight:800;padding:12px}
.off.dim{background:rgba(0,0,0,.8)}
#msg{min-height:42px;font-size:clamp(18px,3.4vw,30px);font-weight:800;text-align:center}
#acts{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
button{font:inherit;font-size:22px;font-weight:800;padding:8px 22px;border:0;border-radius:999px;background:var(--or);color:#1F2A44;cursor:pointer;box-shadow:0 6px 0 rgba(31,42,68,.3)}
button.small{font-size:19px;padding:5px 14px;background:var(--ye)}
#next,#again{font-size:28px;padding:12px 32px}
button:focus-visible{outline:4px solid var(--fg);outline-offset:3px}
#done{display:none;text-align:center;flex-direction:column;align-items:center;gap:14px;padding:24px 8px}
#done h2{margin:0;font-size:clamp(32px,6vw,54px);font-weight:800}
#done p{margin:0;font-size:clamp(20px,3.6vw,30px);font-weight:500}
.note{margin:0;text-align:center;font-size:18px;font-weight:600}
@media (prefers-reduced-motion:reduce){.bin.hint,.mi.hint,#st.hint,.shake,.win .job{animation:none}}
</style>
</head>
<body>
<main id="app">
<header>
<svg width="90" height="68" viewBox="0 0 200 150" role="img" aria-label="A friendly turtle"><rect x="40" y="105" width="28" height="30" rx="12" fill="#1E8F7E"/><rect x="120" y="105" width="28" height="30" rx="12" fill="#1E8F7E"/><ellipse cx="95" cy="80" rx="70" ry="50" fill="#2BB5A0"/><circle cx="70" cy="70" r="14" fill="#1E8F7E"/><circle cx="105" cy="55" r="14" fill="#1E8F7E"/><circle cx="120" cy="90" r="14" fill="#1E8F7E"/><circle cx="168" cy="72" r="24" fill="#7FD6B8"/><circle cx="176" cy="66" r="4" fill="#1F2A44"/><path d="M162 82 Q172 90 182 82" stroke="#1F2A44" stroke-width="3" fill="none"/></svg>
<div><h1>Who Does What?</h1><p id="hint">Get ready!</p></div>
<div id="side"><button id="hear" class="small">🔊 Hear it</button><button id="voice" class="small" aria-pressed="true">Voice on</button><div id="stars" aria-label="Progress"></div></div>
</header>
<section id="stage"></section>
<div id="msg" role="status" aria-live="polite"></div>
<div id="acts"><button id="hintBtn" class="small">💡 Hint</button><button id="next" hidden>Next round</button></div>
<section id="done">
<h2>You are a Boss Spotter!</h2>
<p>You know the hardware, the apps, and the boss. You shut down the right way. Show your grown-up!</p>
<button id="again">Play again</button>
</section>
<p class="note">Hardware is what we touch. Apps are programs we use. The boss (the OS) helps everyone work together.</p>
</main>
<script>
var BINS={hw:{n:"Hardware",e:"🔧",d:"Parts we touch",c:"#FF8A3D",s:"hardware"},app:{n:"Apps",e:"📱",d:"Programs we use",c:"#2BB5A0",s:"an app"},os:{n:"The Boss",e:"👔",d:"The OS helps everyone",c:"#FFD23F",s:"a job for the boss"}};
var JOBS=[{t:"Keyboard",e:"⌨️",b:"hw"},{t:"Screen",e:"🖥️",b:"hw"},{t:"Mouse",e:"🖱️",b:"hw"},{t:"Paint",e:"🎨",b:"app"},{t:"A game",e:"🎮",b:"app"},{t:"Story writer",e:"📝",b:"app"},{t:"Starts the computer",e:"🔌",b:"os"},{t:"Opens apps",e:"🪟",b:"os"},{t:"Keeps files and folders",e:"📁",b:"os"}];
var ROUNDS=[
{type:"sort",hint:"Round 1: Who does what? Pick hardware, an app, or the boss."},
{type:"shut",hint:"Round 2: Shut down the computer the right way. Start, then Power, then Shut down."}
];
var r=0,ii=0,order=[],locked=true,step=0,voiceOn=true,ac=null,tm=null;
var $=function(id){return document.getElementById(id)};
function mk(tag,cls,txt){var d=document.createElement(tag);if(cls)d.className=cls;if(txt!==undefined)d.textContent=txt;return d}
function tone(f,d){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();var o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;g.gain.value=0.08;o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+(d||0.15));}catch(e){}}
function win(){tone(660,0.12);setTimeout(function(){tone(880,0.18)},120)}
function speak(t){if(!voiceOn)return;try{window.speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(t);u.rate=0.85;window.speechSynthesis.speak(u)}catch(e){}}
function say(t){$("msg").textContent=t}
function stars(){var s="";for(var i=0;i<ROUNDS.length;i++){s+=i<r?"⭐":"☆"}$("stars").textContent=s}
function clearHints(){[].slice.call(document.querySelectorAll(".hint")).forEach(function(e){e.classList.remove("hint")})}
function later(f,ms){clearTimeout(tm);tm=setTimeout(f,ms)}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function startRound(){
clearTimeout(tm);var R=ROUNDS[r];ii=0;stars();$("hint").textContent=R.hint;$("next").hidden=true;$("done").style.display="none";$("stage").style.display="flex";$("acts").style.display="flex";$("hintBtn").hidden=false;
say("");locked=true;$("stage").innerHTML="";speak(R.hint);
var my=r;later(function(){if(my!==r)return;if(R.type==="sort"){order=shuffle(JOBS);showJob()}else showShut()},R.hint.length*55+400)}
/* round 1 */
function showJob(){
var j=order[ii],st=$("stage");st.innerHTML="";locked=false;
var p=mk("div","panel");p.appendChild(mk("div","count","Job "+(ii+1)+" of "+order.length));
var jb=mk("div","job");jb.appendChild(mk("span","e",j.e));jb.appendChild(mk("span","",j.t));p.appendChild(jb);st.appendChild(p);
var bs=mk("div","bins");
["hw","app","os"].forEach(function(k){var B=BINS[k],b=mk("button","bin");b.dataset.k=k;b.style.background=B.c;
b.appendChild(mk("span","e",B.e));b.appendChild(mk("b","",B.n));b.appendChild(mk("span","d",B.d));
b.addEventListener("click",function(){pick(k,b)});bs.appendChild(b)});
st.appendChild(bs);say("");speak("Who does "+j.t+"?")}
function pick(k,b){
if(locked)return;clearHints();var j=order[ii];
if(k===j.b){locked=true;win();var m="Yes! "+j.t+" is "+BINS[k].s+"!";say(m);speak(m);$("stage").classList.add("win");
later(function(){$("stage").classList.remove("win");ii++;if(ii>=order.length)roundDone();else showJob()},1800)}
else{tone(220,0.2);b.classList.remove("shake");void b.offsetWidth;b.classList.add("shake");say("Not quite. Try again!");speak("Not quite. Try again.")}}
/* round 2 */
function showShut(){
var st=$("stage");st.innerHTML="";locked=false;step=0;
var s=mk("div","scr");s.id="scr";
[["🗑️","Bin",12,10],["📁","Files",12,34]].forEach(function(d){var i=mk("div","ico");i.style.left=d[2]+"px";i.style.top=d[3]+"%";i.appendChild(mk("span","",d[0]));i.appendChild(document.createTextNode(d[1]));s.appendChild(i)});
var tb=mk("div","tb");var sb=mk("button","",'🪟 Start');sb.id="st";sb.addEventListener("click",function(){clickStart()});tb.appendChild(sb);tb.appendChild(mk("div","clk","10:30"));s.appendChild(tb);
st.appendChild(s);say("");speak("Click Start, then Power, then Shut down.")}
function menu(title,items){
var old=$("mn");if(old)old.remove();
var m=mk("div","menu");m.id="mn";m.appendChild(mk("h4","",title));
items.forEach(function(it){var b=mk("button","mi",it[0]);b.id=it[1];b.addEventListener("click",it[2]);m.appendChild(b)});
$("scr").appendChild(m)}
function closeMenu(){var m=$("mn");if(m)m.remove();step=0}
function clickStart(){
if(locked)return;clearHints();tone(520,0.07);
if($("mn")){closeMenu();return}
step=1;menu("Start",[["📂 File Explorer","fe",function(){wrong("File Explorer finds files. We want Power!")}],["⚙️ Settings","se",function(){wrong("Settings change things. We want Power!")}],["⏻ Power","pw",function(){clearHints();tone(520,0.07);step=2;showPower()}]])}
function showPower(){
menu("Power",[["😴 Sleep","sl",function(){sleepIt()}],["🔄 Restart","rs",function(){restartIt()}],["⏻ Shut down","sd",function(){shutIt()}]])}
function wrong(m){tone(220,0.2);say(m);speak(m)}
function overlay(txt,cls){var o=mk("div","off"+(cls?" "+cls:""),txt);o.id="ov";$("scr").appendChild(o)}
function dropOv(){var o=$("ov");if(o)o.remove()}
function sleepIt(){if(locked)return;clearHints();locked=true;closeMenu();overlay("😴 Zzz...","dim");
var m="Sleep rests the computer. It is not off. Try Shut down!";say(m);speak(m);later(function(){dropOv();locked=false},2200)}
function restartIt(){if(locked)return;clearHints();locked=true;closeMenu();overlay("🔄 Restarting...");
var m="Restart turns it off and on again. We want Shut down!";say(m);speak(m);later(function(){dropOv();locked=false},2200)}
function shutIt(){if(locked)return;clearHints();locked=true;closeMenu();overlay("Shutting down...");
speak("Shutting down.");
later(function(){var o=$("ov");if(o)o.textContent="Good night! 🌙";win();var m="Yes! You shut it down the right way!";say(m);speak(m);later(roundDone,2400)},1500)}
/* flow */
function roundDone(){
locked=true;if(r<ROUNDS.length-1){say("Round complete! Great job!");speak("Round complete! Great job!");$("next").hidden=false;$("hintBtn").hidden=true}
else finish()}
function finish(){
r=ROUNDS.length;stars();$("stage").style.display="none";$("acts").style.display="none";say("");$("hint").textContent="";$("done").style.display="flex";
tone(660,0.15);setTimeout(function(){tone(880,0.15)},150);setTimeout(function(){tone(1100,0.25)},300);speak("You are a Boss Spotter!")}
$("next").addEventListener("click",function(){r++;startRound()});
$("again").addEventListener("click",function(){r=0;startRound()});
$("hintBtn").addEventListener("click",function(){
if(locked)return;clearHints();var R=ROUNDS[r];
if(R.type==="sort"){var b=document.querySelector('.bin[data-k="'+order[ii].b+'"]');if(b){b.classList.add("hint");say("Look at the glowing box!");speak("Look at the glowing box.")}return}
var id=step===0?"st":step===1?"pw":"sd",e=$(id);if(e){e.classList.add("hint");say("Look at the glowing button!");speak("Look at the glowing button.")}});
$("hear").addEventListener("click",function(){var v=voiceOn;voiceOn=true;speak($("hint").textContent);voiceOn=v});
$("voice").addEventListener("click",function(){voiceOn=!voiceOn;this.textContent=voiceOn?"Voice on":"Voice off";this.setAttribute("aria-pressed",voiceOn);if(!voiceOn){try{window.speechSynthesis.cancel()}catch(e){}}});
startRound();
</script>
</body>
</html>
