<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Safe Surfers</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#FFF8EC;--fg:#1F2A44;--panel:#FFFFFF;--line:#E4DED2;--or:#FF8A3D;--te:#2BB5A0;--ye:#FFD23F;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1F2A44;--fg:#FFF8EC;--panel:#2C3A5C;--line:#40507A}}
:root[data-theme="dark"]{--bg:#1F2A44;--fg:#FFF8EC;--panel:#2C3A5C;--line:#40507A}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:'Baloo 2','Trebuchet MS',system-ui,sans-serif;min-height:100vh}
#app{max-width:1100px;margin:0 auto;padding:20px 20px 40px;display:flex;flex-direction:column;gap:20px}
header{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
h1{margin:0;font-size:clamp(32px,6vw,56px);font-weight:800;line-height:1.1}
#hint{margin:0;font-size:clamp(20px,3.2vw,30px);font-weight:700}
#side{margin-left:auto;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
#stars{font-size:40px;letter-spacing:4px}
#tray{min-height:240px;display:flex;flex-wrap:wrap;gap:16px;justify-content:center;align-items:center;padding:20px;background:var(--panel);border:4px dashed var(--line);border-radius:32px;color:#1F2A44}
#tray.col{flex-direction:column}
#targets{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px}
.target{min-height:260px;border-radius:32px;padding:16px;display:flex;flex-direction:column;align-items:center;gap:6px;color:#1F2A44;border:4px solid transparent;transition:transform .15s,border-color .15s;text-align:center}
.target.over{border-color:#1F2A44;transform:scale(1.03)}
.target .big{font-size:80px;line-height:1.1}
.target .name{font-size:32px;font-weight:800;line-height:1.1}
.slot{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.item{width:150px;height:170px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:#fff;color:#1F2A44;border-radius:32px;box-shadow:0 6px 0 rgba(31,42,68,.25);cursor:grab;user-select:none;-webkit-user-select:none;touch-action:none;position:relative;z-index:1;transition:transform .25s;text-align:center}
.item .e{font-size:80px;line-height:1.1}
.item .c{font-size:22px;font-weight:800;line-height:1.1}
.item.drag{z-index:50;cursor:grabbing;transition:none;box-shadow:0 14px 24px rgba(31,42,68,.35)}
.item.back{animation:shake .35s}
.item.placed{width:100px;height:104px;border-radius:20px;pointer-events:none;box-shadow:none;cursor:default}
.item.placed .e{font-size:44px}
.item.placed .c{font-size:15px}
.scn{background:#fff;border-radius:32px;padding:24px;text-align:center;width:100%;max-width:640px;box-shadow:0 6px 0 rgba(31,42,68,.25)}
.scn .em{font-size:110px;line-height:1.1}
.scn p{margin:0;font-size:34px;font-weight:700;line-height:1.2}
.scn.back{animation:shake .35s}
.bar{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;align-items:center;width:100%}
.bigbtn{font-size:32px;padding:16px 36px}
.bigbtn.safe{background:#7FD6B8}
.note{margin:0;width:100%;text-align:center;font-size:22px;font-weight:600}
.page{position:relative;width:100%;max-width:640px;height:300px;background:#fff;border:4px solid #1F2A44;border-radius:20px;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.page .em{font-size:90px;line-height:1.1}
.page p{margin:0;font-size:28px;font-weight:700}
.pop{position:absolute;width:min(300px,72%);background:#fff;border:4px solid #1F2A44;border-radius:16px;box-shadow:0 10px 20px rgba(0,0,0,.3);text-align:center;overflow:hidden}
.pop.back{animation:shake .35s}
.pop .ph{background:#FF8A3D;font-weight:800;font-size:24px;padding:6px}
.pop .pb{font-size:30px;font-weight:800;padding:12px 8px}
.pop button{font-size:24px;padding:8px 24px;margin-bottom:12px;background:#2BB5A0;box-shadow:none}
@keyframes shake{25%{translate:-10px}75%{translate:10px}}
#msg{min-height:48px;font-size:clamp(24px,4vw,36px);font-weight:800;text-align:center}
button{font:inherit;font-size:28px;font-weight:800;padding:12px 30px;border:0;border-radius:999px;background:var(--or);color:#1F2A44;cursor:pointer;box-shadow:0 6px 0 rgba(31,42,68,.3)}
button.small{font-size:22px;padding:8px 20px;background:var(--ye)}
#next,#again{align-self:center;font-size:32px;padding:14px 36px}
button:focus-visible{outline:4px solid var(--fg);outline-offset:4px}
#done{display:none;text-align:center;flex-direction:column;align-items:center;gap:16px;padding:32px 16px}
#done .party{font-size:120px;line-height:1.1}
#done h2{margin:0;font-size:clamp(36px,7vw,64px);font-weight:800}
#done p{margin:0;font-size:clamp(24px,4vw,34px);font-weight:500}
@media (prefers-reduced-motion:reduce){.item,.target{transition:none}.item.back,.scn.back,.pop.back{animation:none}}
</style>
</head>
<body>
<main id="app">
<header>
<svg width="130" height="98" viewBox="0 0 200 150" role="img" aria-label="A friendly turtle"><rect x="40" y="105" width="28" height="30" rx="12" fill="#1E8F7E"/><rect x="120" y="105" width="28" height="30" rx="12" fill="#1E8F7E"/><ellipse cx="95" cy="80" rx="70" ry="50" fill="#2BB5A0"/><circle cx="70" cy="70" r="14" fill="#1E8F7E"/><circle cx="105" cy="55" r="14" fill="#1E8F7E"/><circle cx="120" cy="90" r="14" fill="#1E8F7E"/><circle cx="168" cy="72" r="24" fill="#7FD6B8"/><circle cx="176" cy="66" r="4" fill="#1F2A44"/><path d="M162 82 Q172 90 182 82" stroke="#1F2A44" stroke-width="3" fill="none"/></svg>
<div><h1>Safe Surfers</h1><p id="hint"></p></div>
<div id="side"><button id="hear" class="small" aria-label="Hear the instruction">🔊 Hear it</button><button id="voice" class="small" aria-pressed="true">Voice on</button><div id="stars" aria-label="Progress"></div></div>
</header>
<section id="game"><div id="tray" aria-label="Play area"></div></section>
<section id="targets" aria-label="Places to drop"></section>
<div id="msg" role="status" aria-live="polite"></div>
<button id="next" hidden>Next round</button>
<section id="done">
<div class="party">🎉</div>
<h2>You are a Safety Star!</h2>
<p>You know the three rules: ask first, stop, and keep it private. Tell your grown-up!</p>
<button id="again">Play again</button>
</section>
</main>
<script>
var SCN=[
{e:"🎁",t:"A pop-up says: You won a prize! Click here!",a:"ask",x:"A surprise prize is a trick. Stop and call a grown-up."},
{e:"🎮",t:"Your grown-up opens a kids game for you.",a:"safe",x:"A grown-up picked it, so it is safe."},
{e:"👤",t:"Someone you don't know asks: What is your name?",a:"ask",x:"Never answer a stranger. Tell a grown-up."},
{e:"📞",t:"A video call with your family. A grown-up is next to you.",a:"safe",x:"Calling family with a grown-up is safe."},
{e:"💰",t:"A message says: Send your address to get free money!",a:"ask",x:"That is a trick. Show a grown-up."},
{e:"📺",t:"A learning video that your grown-up picked.",a:"safe",x:"A grown-up picked it, so it is safe."}
];
var POPS=[{h:"Hooray!!!",b:"🎁 You won a prize!",btn:"CLICK HERE"},{h:"Free phone!",b:"📱 Get it now!",btn:"CLAIM"},{h:"Money time!",b:"💰 Free money for you!",btn:"CLICK NOW"}];
var ROUNDS=[
{type:"quick",hint:"Is it safe? Or do we ask a grown-up first? Press the right button."},
{type:"drag",hint:"What is okay to share? What needs a grown-up first? Drag each card to the right box.",targets:[{id:"ok",name:"Okay to share",emoji:"😊",color:"#7FD6B8"},{id:"ask",name:"Ask a grown-up first",emoji:"🙋",color:"#FFB98A"}],items:[{e:"🍕",c:"Favorite food",t:"ok"},{e:"🎨",c:"Favorite color",t:"ok"},{e:"🐶",c:"Favorite animal",t:"ok"},{e:"🏠",c:"Address",t:"ask"},{e:"🔑",c:"Password",t:"ask"},{e:"🏫",c:"School",t:"ask"}]},
{type:"popup",hint:"Pop-ups will jump out! Do not click them. Press Call a grown-up."}
];
var r=0,placed=0,ac=null,voiceOn=true;
var $=function(id){return document.getElementById(id)};
function mk(tag,cls,txt){var d=document.createElement(tag);if(cls)d.className=cls;if(txt!==undefined)d.textContent=txt;return d}
function tone(f,d){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();var o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;g.gain.value=0.08;o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+(d||0.15));}catch(e){}}
function speak(t){if(!voiceOn)return;try{window.speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(t);u.rate=0.85;window.speechSynthesis.speak(u)}catch(e){}}
function say(t){$("msg").textContent=t}
function stars(){var s="";for(var i=0;i<ROUNDS.length;i++){s+=i<r?"⭐":"☆"}$("stars").textContent=s}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function win(){tone(660,0.12);setTimeout(function(){tone(880,0.18)},120)}
function roundDone(m){say(m||"Great job!");if(r<ROUNDS.length-1){$("next").hidden=false}else{setTimeout(finish,1600)}}
function render(){
var R=ROUNDS[r];placed=0;stars();say("");
$("hint").textContent=R.hint;$("next").hidden=true;
$("game").style.display="";$("done").style.display="none";
var tr=$("tray");tr.innerHTML="";tr.className=R.type==="drag"?"":"col";
var tg=$("targets");tg.innerHTML="";tg.style.display=R.type==="drag"?"":"none";
if(R.type==="drag"){
shuffle(R.items).forEach(function(it){
var d=mk("div","item");
d.innerHTML='<span class="e">'+it.e+'</span><span class="c">'+it.c+'</span>';
d.setAttribute("role","img");d.setAttribute("aria-label",it.c);d.dataset.t=it.t;d.dataset.c=it.c;
drag(d);tr.appendChild(d)});
R.targets.forEach(function(t){
var d=mk("div","target");d.dataset.id=t.id;d.style.background=t.color;
d.innerHTML='<div class="big">'+t.emoji+'</div><div class="name">'+t.name+'</div><div class="slot"></div>';
tg.appendChild(d)})}
else if(R.type==="quick"){buildQuick(tr)}
else if(R.type==="popup"){buildPopup(tr)}
if(R.type!=="quick"){setTimeout(function(){speak(R.hint)},300)}}
function buildQuick(tr){
var list=shuffle(SCN),idx=0;
function show(){
tr.innerHTML="";
var s=list[idx];
var card=mk("div","scn");card.appendChild(mk("div","em",s.e));card.appendChild(mk("p","",s.t));
var bar=mk("div","bar");
var b1=mk("button","bigbtn safe","✅ Safe");var b2=mk("button","bigbtn","🙋 Ask a grown-up");
function answer(a){
if(a===s.a){win();say(s.x);idx++;if(idx===list.length){tr.innerHTML="";roundDone("You know what is safe!")}else{setTimeout(show,1400)}}
else{card.classList.remove("back");void card.offsetWidth;card.classList.add("back");tone(220,0.2);say(s.x)}}
b1.addEventListener("click",function(){answer("safe")});
b2.addEventListener("click",function(){answer("ask")});
bar.appendChild(b1);bar.appendChild(b2);
tr.appendChild(card);tr.appendChild(bar);tr.appendChild(mk("p","note","Question "+(idx+1)+" of "+list.length));
speak(s.t)}
show()}
function buildPopup(tr){
var order=shuffle(POPS),n=0,cur=null;
var page=mk("div","page");page.appendChild(mk("div","em","📺"));page.appendChild(mk("p","","Fun Video Page"));
var call=mk("button","bigbtn safe","🙋 Call a grown-up");
tr.appendChild(page);tr.appendChild(call);tr.appendChild(mk("p","note","A pop-up will jump out. Do not click it!"));
function showPop(){
if(n===order.length){roundDone("You are a Pop-up Stopper!");return}
var d=order[n];var p=mk("div","pop");
p.style.left=(5+Math.floor(Math.random()*22))+"%";p.style.top=(8+Math.floor(Math.random()*28))+"%";
p.appendChild(mk("div","ph",d.h));p.appendChild(mk("div","pb",d.b));
var b=mk("button","",d.btn);
b.addEventListener("click",function(){p.classList.remove("back");void p.offsetWidth;p.classList.add("back");tone(220,0.25);say("Oops! That is a trick. Stop. Hands in your lap. Call a grown-up!");speak("Oops! That is a trick. Stop and call a grown-up.")});
p.appendChild(b);page.appendChild(p);cur=p;say("");speak("A pop-up! Stop. Hands in your lap.")}
call.addEventListener("click",function(){
if(!cur){say("No pop-up yet. Wait for it!");return}
cur.remove();cur=null;win();n++;say("Well done! You did not click it.");setTimeout(showPop,1500)});
setTimeout(showPop,1200)}
function drag(el){
var sx=0,sy=0,over=null;
el.addEventListener("pointerdown",function(e){
e.preventDefault();el.setPointerCapture(e.pointerId);sx=e.clientX;sy=e.clientY;
el.classList.remove("back");el.classList.add("drag");tone(520,0.06);speak(el.dataset.c)});
el.addEventListener("pointermove",function(e){
if(!el.classList.contains("drag"))return;
el.style.transform="translate("+(e.clientX-sx)+"px,"+(e.clientY-sy)+"px) scale(1.08)";
var t=at(e);if(over&&over!==t)over.classList.remove("over");over=t;if(t)t.classList.add("over")});
el.addEventListener("pointerup",function(e){
if(!el.classList.contains("drag"))return;
el.classList.remove("drag");
var t=at(e);if(over)over.classList.remove("over");over=null;
if(t&&t.dataset.id===el.dataset.t){ok(el,t)}
else{el.style.transform="";el.classList.add("back");say(t?"Not that box. Think again!":"Hold, move, and let go on a box.");tone(220,0.2)}});
el.addEventListener("pointercancel",function(){el.classList.remove("drag");el.style.transform=""})}
function at(e){
var els=document.elementsFromPoint(e.clientX,e.clientY);
for(var i=0;i<els.length;i++){if(els[i].classList&&els[i].classList.contains("target"))return els[i]}return null}
function ok(el,t){
el.style.transform="";el.classList.add("placed");t.querySelector(".slot").appendChild(el);
win();placed++;
if(placed===ROUNDS[r].items.length){roundDone("You know what to keep private!")}else{say("Yes! That is the right box.")}}
function finish(){r=ROUNDS.length;stars();$("game").style.display="none";$("targets").style.display="none";$("msg").textContent="";$("next").hidden=true;$("hint").textContent="";$("done").style.display="flex";tone(660,0.15);setTimeout(function(){tone(880,0.15)},150);setTimeout(function(){tone(1100,0.25)},300);speak("You are a Safety Star!")}
$("next").addEventListener("click",function(){r++;render()});
$("again").addEventListener("click",function(){r=0;render()});
$("hear").addEventListener("click",function(){var v=voiceOn;voiceOn=true;speak($("hint").textContent);voiceOn=v});
$("voice").addEventListener("click",function(){voiceOn=!voiceOn;this.textContent=voiceOn?"Voice on":"Voice off";this.setAttribute("aria-pressed",voiceOn);if(!voiceOn){try{window.speechSynthesis.cancel()}catch(e){}}});
render();
</script>
</body>
</html>
