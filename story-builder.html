<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Story Builder</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#FFF8EC;--fg:#1F2A44;--panel:#FFFFFF;--line:#E4DED2;--or:#FF8A3D;--te:#2BB5A0;--ye:#FFD23F;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1F2A44;--fg:#FFF8EC;--panel:#2C3A5C;--line:#40507A}}
:root[data-theme="dark"]{--bg:#1F2A44;--fg:#FFF8EC;--panel:#2C3A5C;--line:#40507A}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:'Baloo 2','Trebuchet MS',system-ui,sans-serif;min-height:100vh}
#app{max-width:1000px;margin:0 auto;padding:16px 16px 32px;display:flex;flex-direction:column;gap:14px}
header{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
h1{margin:0;font-size:clamp(28px,5vw,48px);font-weight:800;line-height:1.1}
#hint{margin:0;font-size:clamp(18px,2.6vw,26px);font-weight:700}
#side{margin-left:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
#stars{font-size:36px;letter-spacing:4px}
.clue{background:var(--panel);border:4px solid var(--fg);border-radius:28px;padding:18px 24px;display:flex;align-items:center;gap:24px;color:#1F2A44}
.clue.shake{animation:shake .35s}
.clue .em{font-size:clamp(64px,12vw,110px);line-height:1}
#tiles{display:flex;flex-wrap:wrap;gap:6px;align-items:flex-end}
.tl{min-width:clamp(30px,6vw,52px);height:clamp(42px,8vw,64px);padding:0 6px;display:grid;place-items:center;font-size:clamp(24px,5vw,44px);font-weight:800;background:#fff;border:3px solid #E4DED2;border-radius:12px}
.tl.sp{min-width:clamp(18px,3vw,28px);padding:0;border:0;border-bottom:6px solid #E4DED2;border-radius:0;background:none}
.tl.done{background:#7FD6B8;border-color:#2BB5A0}
.tl.sp.done{background:none;border-bottom-color:#2BB5A0}
.tl.now{border-color:#FF8A3D;background:#FFF1D6;animation:glow .8s infinite alternate}
.tl.sp.now{background:none;border-bottom-color:#FF8A3D}
.paper{background:#fff;color:#1F2A44;border:4px solid var(--fg);border-radius:20px;padding:16px 24px;min-height:84px;font-size:clamp(28px,6vw,56px);font-weight:600;line-height:1.2;overflow-wrap:anywhere}
.cur{display:inline-block;width:6px;height:1em;background:#FF8A3D;margin-left:3px;vertical-align:text-bottom;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
#kb{display:flex;flex-direction:column;gap:6px;width:100%}
.kr{display:flex;gap:5px;justify-content:center}
.kb{flex:1 1 0;min-width:0;max-width:64px;height:clamp(38px,7.4vw,54px);border-radius:10px;border:3px solid var(--fg);background:var(--panel);color:var(--fg);font:inherit;font-size:clamp(12px,2.4vw,20px);font-weight:800;padding:0;box-shadow:none;touch-action:manipulation}
.kb.w{flex:2 1 0;max-width:110px}
.kb.sp{flex:1 1 0;max-width:520px}
.kb.flash{background:#7FD6B8;color:#1F2A44}
.kb.on{background:#FFD23F;color:#1F2A44}
.kb.hint{background:#FFD23F;color:#1F2A44;animation:glow .8s infinite alternate}
@keyframes glow{from{transform:scale(1)}to{transform:scale(1.1)}}
@keyframes shake{25%{translate:-8px}75%{translate:8px}}
#msg{min-height:44px;font-size:clamp(20px,3.6vw,32px);font-weight:800;text-align:center}
button{font:inherit;font-size:26px;font-weight:800;padding:10px 28px;border:0;border-radius:999px;background:var(--or);color:#1F2A44;cursor:pointer;box-shadow:0 6px 0 rgba(31,42,68,.3)}
button.small{font-size:20px;padding:6px 16px;background:var(--ye)}
button.kb{box-shadow:none;border-radius:10px;padding:0}
#next,#again,#read{align-self:center;font-size:30px;padding:12px 34px}
button:focus-visible{outline:4px solid var(--fg);outline-offset:3px}
#done{display:none;flex-direction:column;align-items:center;gap:14px;padding:20px 8px;text-align:center}
#done h2{margin:0;font-size:clamp(34px,7vw,56px);font-weight:800}
#story{background:var(--panel);color:#1F2A44;border:4px solid var(--fg);border-radius:24px;padding:16px 24px;width:100%;max-width:640px;text-align:left;display:flex;flex-direction:column;gap:10px}
#story div{display:flex;align-items:center;gap:16px;font-size:clamp(22px,4.4vw,36px);font-weight:700}
#story span.e{font-size:clamp(44px,8vw,64px)}
.note{margin:0;text-align:center;font-size:20px;font-weight:600}
@media (prefers-reduced-motion:reduce){.kb.hint,.tl.now{animation:none;outline:4px solid #1F2A44}.cur{animation:none}.clue.shake{animation:none}}
</style>
</head>
<body>
<main id="app">
<header>
<svg width="104" height="78" viewBox="0 0 200 150" role="img" aria-label="A friendly turtle"><rect x="40" y="105" width="28" height="30" rx="12" fill="#1E8F7E"/><rect x="120" y="105" width="28" height="30" rx="12" fill="#1E8F7E"/><ellipse cx="95" cy="80" rx="70" ry="50" fill="#2BB5A0"/><circle cx="70" cy="70" r="14" fill="#1E8F7E"/><circle cx="105" cy="55" r="14" fill="#1E8F7E"/><circle cx="120" cy="90" r="14" fill="#1E8F7E"/><circle cx="168" cy="72" r="24" fill="#7FD6B8"/><circle cx="176" cy="66" r="4" fill="#1F2A44"/><path d="M162 82 Q172 90 182 82" stroke="#1F2A44" stroke-width="3" fill="none"/></svg>
<div><h1>Story Builder</h1><p id="hint"></p></div>
<div id="side"><button id="hear" class="small">🔊 Hear it</button><button id="voice" class="small" aria-pressed="true">Voice on</button><div id="stars" aria-label="Progress"></div></div>
</header>
<section id="play">
<div id="clue" class="clue"><span class="em" id="cem"></span><div id="tiles" aria-label="Type this"></div></div>
<div id="paper" class="paper" aria-label="Your writing"></div>
</section>
<div id="msg" role="status" aria-live="polite"></div>
<div id="kb" aria-label="On-screen keyboard"></div>
<button id="next" hidden>Next round</button>
<section id="done">
<h2>Your story!</h2>
<div id="story"></div>
<button id="read">🔊 Read my story</button>
<button id="again">Play again</button>
</section>
<p class="note">Type with your keyboard. You can also click the keys on the screen. Your writing stays on this page.</p>
</main>
<script>
var R1=[{e:"🐱",t:"CAT"},{e:"☀️",t:"SUN"},{e:"🐶",t:"DOG"},{e:"🚌",t:"BUS"},{e:"🎩",t:"HAT"},{e:"🐷",t:"PIG"}];
var R2=[{e:"🐱",t:"MY CAT"},{e:"🐶",t:"BIG DOG"},{e:"🚌",t:"RED BUS"},{e:"☀️",t:"HOT SUN"}];
var R3=[{e:"🐱",t:"I see a cat."},{e:"☀️",t:"The sun is hot."},{e:"🐶",t:"My dog is big."},{e:"🚌",t:"A bus is red."}];
var ROUNDS=[
{hint:"Round 1: Type the word.",n:4,pool:R1},
{hint:"Round 2: Use the Space bar between words.",n:3,pool:R2},
{hint:"Round 3: A big letter first. A dot last.",n:3,pool:R3}
];
var KROWS=[
"QWERTYUIOP".split("").map(function(c){return[c,c]}),
"ASDFGHJKL".split("").map(function(c){return[c,c]}),
[["SHIFT","Shift ⇧","w"]].concat("ZXCVBNM".split("").map(function(c){return[c,c]})).concat([[",",","],[".","."]]),
[["SPACE","Space","sp"]]
];
var r=0,list=[],li=0,pos=0,cur=null,locked=true,story=[],shiftOn=false,ac=null,voiceOn=true;
var $=function(id){return document.getElementById(id)};
function tone(f,d){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();var o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;g.gain.value=0.08;o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+(d||0.15));}catch(e){}}
function win(){tone(660,0.12);setTimeout(function(){tone(880,0.18)},120)}
function speak(t){if(!voiceOn)return;try{window.speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(t);u.rate=0.85;window.speechSynthesis.speak(u)}catch(e){}}
function say(t){$("msg").textContent=t}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function stars(){var s="";for(var i=0;i<ROUNDS.length;i++){s+=i<r?"⭐":"☆"}$("stars").textContent=s}
function keyName(ch){if(ch===" ")return"the Space bar";if(ch===".")return"the dot";if(ch===",")return"the comma";return"the letter "+ch.toUpperCase()}
function buildKb(){
var kb=$("kb");kb.innerHTML="";
KROWS.forEach(function(row){var d=document.createElement("div");d.className="kr";
row.forEach(function(k){var b=document.createElement("button");b.className="kb"+(k[2]?" "+k[2]:"");b.textContent=k[1];b.dataset.id=k[0];b.setAttribute("aria-label",k[0]==="SPACE"?"Space bar":k[0]==="SHIFT"?"Shift":k[1]);
b.addEventListener("pointerdown",function(e){e.preventDefault();onScreen(k[0])});d.appendChild(b)});kb.appendChild(d)})}
function onScreen(id){
if(id==="SHIFT"){shiftOn=!shiftOn;mark();return}
var ch=id==="SPACE"?" ":id;
if(/[A-Z]/.test(id)){ch=shiftOn?id:id.toLowerCase()}
shiftOn=false;mark();press(ch)}
function mark(){var ks=document.querySelectorAll(".kb");for(var i=0;i<ks.length;i++){if(ks[i].dataset.id==="SHIFT")ks[i].classList.toggle("on",shiftOn)}}
function flash(id){var ks=document.querySelectorAll(".kb");for(var i=0;i<ks.length;i++){if(ks[i].dataset.id===id){(function(k){k.classList.add("flash");setTimeout(function(){k.classList.remove("flash")},280)})(ks[i])}}}
function setHint(){
var ks=document.querySelectorAll(".kb"),ids=[];
if(cur&&pos<cur.t.length){var e=cur.t.charAt(pos);
if(e===" ")ids=["SPACE"];else if(e==="."||e===",")ids=[e];else{ids=[e.toUpperCase()];if(r===2&&/[A-Z]/.test(e))ids.push("SHIFT")}}
for(var i=0;i<ks.length;i++){ks[i].classList.toggle("hint",ids.indexOf(ks[i].dataset.id)>-1)}}
function render(){
var t=cur?cur.t:"",tl=$("tiles");tl.innerHTML="";
for(var i=0;i<t.length;i++){var c=t.charAt(i),s=document.createElement("span");
s.className="tl"+(c===" "?" sp":"")+(i<pos?" done":(i===pos?" now":""));
s.textContent=c===" "?"":c;tl.appendChild(s)}
var p=$("paper");p.textContent=t.slice(0,pos);var cu=document.createElement("span");cu.className="cur";p.appendChild(cu);
setHint()}
function prompt(){
var t=cur.t;
if(r===0)return"Type the word "+t.toLowerCase()+". "+t.split("").join(", ")+".";
if(r===1)return"Type the words "+t.toLowerCase()+". Use the Space bar between the words.";
return"Type the sentence. "+t+" Start with a big letter. End with a dot."}
function startRound(){
var R=ROUNDS[r];list=shuffle(R.pool).slice(0,R.n);li=0;stars();
$("hint").textContent=R.hint;$("next").hidden=true;$("done").style.display="none";$("play").style.display="";$("kb").style.display="";
say("");speak(R.hint);setTimeout(showItem,R.hint.length*55+500)}
function showItem(){
cur=list[li];pos=0;locked=false;
$("cem").textContent=cur.e;render();say("");speak(prompt())}
function press(ch){
if(locked||!cur)return;
var exp=cur.t.charAt(pos),ok=false;
if(exp===" ")ok=(ch===" ");
else if(exp===".")ok=(ch===".");
else ok=(/[a-zA-Z]/.test(ch)&&ch.toLowerCase()===exp.toLowerCase());
flash(ch===" "?"SPACE":ch.toUpperCase());
if(ok){
var tip=(r===2&&/[A-Z]/.test(exp)&&ch!==exp);
pos++;tone(520+pos*25,0.09);render();
say(tip?"Nice! Next time hold Shift for a big letter.":"");
if(pos>=cur.t.length){itemDone()}}
else{
tone(220,0.2);var c=$("clue");c.classList.remove("shake");void c.offsetWidth;c.classList.add("shake");
say("That is "+keyName(ch)+". Look for the glowing key!");speak("Look for the glowing key.")}}
function itemDone(){
locked=true;win();setHint();
if(r===2)story.push(cur);
var m="Great job! "+cur.t.toLowerCase().replace(/\.$/,"")+(r===2?".":"");say("Great job!");speak(m);
setTimeout(function(){li++;if(li>=list.length){roundDone()}else{showItem()}},2200)}
function roundDone(){
cur=null;setHint();
if(r<ROUNDS.length-1){say("Round complete! Great typing!");speak("Round complete! Great typing!");$("next").hidden=false}
else{finish()}}
function finish(){
r=ROUNDS.length;stars();$("play").style.display="none";$("kb").style.display="none";say("");$("hint").textContent="You built a story!";
var st=$("story");st.innerHTML="";
story.forEach(function(s){var d=document.createElement("div"),e=document.createElement("span");e.className="e";e.textContent=s.e;var t=document.createElement("span");t.textContent=s.t;d.appendChild(e);d.appendChild(t);st.appendChild(d)});
$("done").style.display="flex";tone(660,0.15);setTimeout(function(){tone(880,0.15)},150);setTimeout(function(){tone(1100,0.25)},300);
speak("You built a story! Press Read my story to hear it.")}
document.addEventListener("keydown",function(e){
if(e.ctrlKey||e.metaKey||e.altKey)return;
var k=e.key;
if(k==="Shift"){flash("SHIFT");return}
if(e.repeat&&(k===" "||/^[a-zA-Z.,]$/.test(k))){e.preventDefault();return}
if(k===" "){e.preventDefault();press(" ")}
else if(/^[a-zA-Z.,]$/.test(k)){e.preventDefault();press(k)}});
$("next").addEventListener("click",function(){r++;startRound()});
$("again").addEventListener("click",function(){r=0;story=[];startRound()});
$("read").addEventListener("click",function(){var v=voiceOn;voiceOn=true;speak(story.map(function(s){return s.t}).join(" "));voiceOn=v});
$("hear").addEventListener("click",function(){var v=voiceOn;voiceOn=true;speak(cur?prompt():$("hint").textContent);voiceOn=v});
$("voice").addEventListener("click",function(){voiceOn=!voiceOn;this.textContent=voiceOn?"Voice on":"Voice off";this.setAttribute("aria-pressed",voiceOn);if(!voiceOn){try{window.speechSynthesis.cancel()}catch(e){}}});
buildKb();startRound();
</script>
</body>
</html>
