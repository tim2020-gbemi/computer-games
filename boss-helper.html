<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Boss Helper</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#FFF8EC;--fg:#1F2A44;--panel:#FFFFFF;--line:#E4DED2;--or:#FF8A3D;--te:#2BB5A0;--ye:#FFD23F;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1F2A44;--fg:#FFF8EC;--panel:#2C3A5C;--line:#40507A}}
:root[data-theme="dark"]{--bg:#1F2A44;--fg:#FFF8EC;--panel:#2C3A5C;--line:#40507A}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:'Baloo 2','Trebuchet MS',system-ui,sans-serif;min-height:100vh}
#app{max-width:1000px;margin:0 auto;padding:14px 14px 28px;display:flex;flex-direction:column;gap:12px}
header{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
h1{margin:0;font-size:clamp(26px,4.6vw,44px);font-weight:800;line-height:1.1}
#hint{margin:0;font-size:clamp(16px,2.6vw,26px);font-weight:700;max-width:640px}
#side{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
#stars{font-size:34px;letter-spacing:3px}
#stage{display:flex;gap:18px;justify-content:center;align-items:flex-start;flex-direction:column;align-items:center}
.panel{background:var(--panel);color:var(--fg);border:4px solid var(--fg);border-radius:24px;padding:14px 16px;display:flex;flex-direction:column;align-items:center;gap:10px;width:100%;max-width:820px}
.panel h3{margin:0;font-size:clamp(16px,2.6vw,24px);font-weight:800}


.scn{display:flex;align-items:center;gap:16px;font-size:clamp(24px,5vw,44px);font-weight:800;text-align:center;flex-wrap:wrap;justify-content:center}
.scn .e{font-size:clamp(56px,12vw,100px);line-height:1}
.count{font-size:clamp(16px,2.6vw,22px);font-weight:700}
.opts{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;width:100%;max-width:820px}
.opt{flex:1 1 200px;display:flex;flex-direction:column;align-items:center;gap:4px;padding:14px 10px;border-radius:28px;border:4px solid #1F2A44;color:#1F2A44;font:inherit;cursor:pointer;box-shadow:0 6px 0 rgba(31,42,68,.3);touch-action:manipulation}
.opt .e{font-size:clamp(40px,8vw,64px);line-height:1}
.opt b{font-size:clamp(18px,3.4vw,28px);font-weight:800;line-height:1.1}
.opt.hint{animation:pulse .7s infinite alternate;outline:4px solid #1F2A44}
.shake{animation:shake .35s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@keyframes pulse{from{transform:scale(1)}to{transform:scale(1.06)}}
@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.1)}100%{transform:scale(1)}}
.win .scn{animation:pop .5s}
#msg{min-height:42px;font-size:clamp(18px,3.4vw,30px);font-weight:800;text-align:center}
#acts{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
button{font:inherit;font-size:22px;font-weight:800;padding:8px 22px;border:0;border-radius:999px;background:var(--or);color:#1F2A44;cursor:pointer;box-shadow:0 6px 0 rgba(31,42,68,.3)}
button.small{font-size:19px;padding:5px 14px;background:var(--ye)}
#next,#again{font-size:28px;padding:12px 32px}
button:focus-visible{outline:4px solid var(--fg);outline-offset:3px}
#done{display:none;text-align:center;flex-direction:column;align-items:center;gap:14px;padding:24px 8px}
#done h2{margin:0;font-size:clamp(32px,6vw,54px);font-weight:800}
#done p{margin:0;font-size:clamp(20px,3.6vw,30px);font-weight:500}
.note{margin:0;text-align:center;font-size:18px;font-weight:600}
@media (prefers-reduced-motion:reduce){.opt.hint,.shake,.win .scn{animation:none}}
</style>
</head>
<body>
<main id="app">
<header>
<svg width="90" height="68" viewBox="0 0 200 150" role="img" aria-label="A friendly turtle"><rect x="40" y="105" width="28" height="30" rx="12" fill="#1E8F7E"/><rect x="120" y="105" width="28" height="30" rx="12" fill="#1E8F7E"/><ellipse cx="95" cy="80" rx="70" ry="50" fill="#2BB5A0"/><circle cx="70" cy="70" r="14" fill="#1E8F7E"/><circle cx="105" cy="55" r="14" fill="#1E8F7E"/><circle cx="120" cy="90" r="14" fill="#1E8F7E"/><circle cx="168" cy="72" r="24" fill="#7FD6B8"/><circle cx="176" cy="66" r="4" fill="#1F2A44"/><path d="M162 82 Q172 90 182 82" stroke="#1F2A44" stroke-width="3" fill="none"/></svg>
<div><h1>Binary Cards</h1><p id="hint">Get ready!</p></div>
<div id="side"><button id="hear" class="small">🔊 Hear it</button><button id="voice" class="small" aria-pressed="true">Voice on</button><div id="stars" aria-label="Progress"></div></div>
</header>
<section id="stage"></section>
<div id="msg" role="status" aria-live="polite"></div>
<div id="acts"><button id="hintBtn" class="small">💡 Hint</button><button id="next" hidden>Next round</button></div>
<section id="done">
<h2>You are a Boss Helper!</h2>
<p>You know how to keep the computer safe, fix a stuck app, and plug things in. Show your grown-up!</p>
<button id="again">Play again</button>
</section>
<p class="note">The boss looks after us. We look after the boss too!</p>
</main>
<script>
var C=["#FF8A3D","#2BB5A0","#FFD23F"];
var ROUNDS=[
{hint:"Round 1: Keep the computer safe. Pick the best thing to do.",qs:[
{e:"🕵️",s:"A stranger online asks for your password.",o:[["🤫","Say no and tell a grown-up",1],["🗣️","Tell them",0],["📢","Post it for everyone",0]],w:"A password is a secret!"},
{e:"🚶",s:"You finish and walk away from the computer.",o:[["🔒","Lock the screen",1],["🔓","Leave it open",0],["📣","Shout the password",0]],w:"The lock screen keeps our things safe!"},
{e:"🔑",s:"Who can know your password?",o:[["🌍","Everyone",0],["👨‍👩‍👧","A grown-up I trust",1],["🚫","A stranger",0]],w:"Only a grown-up you trust!"}]},
{hint:"Round 2: The app is stuck! What do we do?",qs:[
{e:"🧊",s:"The app is stuck and nothing moves.",o:[["✋","Stop and wait",1],["🔨","Bang the mouse",0],["🤪","Shake the computer",0]],w:"Stop and wait is the best start!"},
{e:"⏳",s:"You waited. It is still stuck.",o:[["🥊","Hit the keys hard",0],["🙋","Tell a grown-up",1],["💧","Pour water on it",0]],w:"A grown-up can help!"},
{e:"🛠️",s:"Who can ask the boss to close a stuck app?",o:[["🙋","A grown-up",1],["🐶","The dog",0],["👻","A ghost",0]],w:"A grown-up can ask the boss!"}]},
{hint:"Round 3: The boss connects things. Pick the right one!",qs:[
{e:"🌐",s:"What connects the computer to the internet?",o:[["🛜","Wi-Fi",1],["🔋","Battery",0],["🖨️","Printer",0]],w:"Wi-Fi connects to the internet!"},
{e:"🎨",s:"You want to print your drawing.",o:[["🎧","Headphones",0],["🖨️","Printer",1],["🛜","Wi-Fi",0]],w:"The printer prints our work!"},
{e:"⚡",s:"How much power is left?",o:[["🔊","Volume",0],["🛜","Wi-Fi",0],["🔋","Battery",1]],w:"The battery tells us!"},
{e:"🖱️",s:"You plug in a mouse. What does the boss say?",o:[["👋","Goodbye!",0],["💬","I found a new device!",1],["🗑️","Delete everything!",0]],w:"The boss notices new things!"}]}
];
var r=0,ii=0,locked=true,voiceOn=true,ac=null,tm=null;
var $=function(id){return document.getElementById(id)};
function mk(tag,cls,txt){var d=document.createElement(tag);if(cls)d.className=cls;if(txt!==undefined)d.textContent=txt;return d}
function tone(f,d){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();var o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;g.gain.value=0.08;o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+(d||0.15));}catch(e){}}
function win(){tone(660,0.12);setTimeout(function(){tone(880,0.18)},120)}
function speak(t){if(!voiceOn)return;try{window.speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(t);u.rate=0.85;window.speechSynthesis.speak(u)}catch(e){}}
function say(t){$("msg").textContent=t}
function stars(){var s="";for(var i=0;i<ROUNDS.length;i++){s+=i<r?"⭐":"☆"}$("stars").textContent=s}
function clearHints(){[].slice.call(document.querySelectorAll(".hint")).forEach(function(e){e.classList.remove("hint")})}
function later(f,ms){clearTimeout(tm);tm=setTimeout(f,ms)}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function startRound(){
clearTimeout(tm);var R=ROUNDS[r];ii=0;stars();$("hint").textContent=R.hint;$("next").hidden=true;$("done").style.display="none";$("stage").style.display="flex";$("acts").style.display="flex";$("hintBtn").hidden=false;
say("");locked=true;$("stage").innerHTML="";speak(R.hint);
var my=r;later(function(){if(my!==r)return;showQ()},R.hint.length*55+400)}
function showQ(){
var R=ROUNDS[r],q=R.qs[ii],st=$("stage");st.innerHTML="";locked=false;say("");
var p=mk("div","panel");p.appendChild(mk("div","count","Problem "+(ii+1)+" of "+R.qs.length));
var sc=mk("div","scn");sc.appendChild(mk("span","e",q.e));sc.appendChild(mk("span","",q.s));p.appendChild(sc);st.appendChild(p);
var os=mk("div","opts");
shuffle(q.o).forEach(function(o,i){var b=mk("button","opt");b.style.background=C[i%3];b.dataset.ok=o[2];b.appendChild(mk("span","e",o[0]));b.appendChild(mk("b","",o[1]));b.addEventListener("click",function(){pick(o,b)});os.appendChild(b)});
st.appendChild(os);speak(q.s)}
function pick(o,b){
if(locked)return;clearHints();var q=ROUNDS[r].qs[ii];
if(o[2]){locked=true;win();var m="Yes! "+q.w;say(m);speak(m);$("stage").classList.add("win");
later(function(){$("stage").classList.remove("win");ii++;if(ii>=ROUNDS[r].qs.length)roundDone();else showQ()},2000)}
else{tone(220,0.2);b.classList.remove("shake");void b.offsetWidth;b.classList.add("shake");say("Not quite. Try again!");speak("Not quite. Try again.")}}
function roundDone(){
locked=true;if(r<ROUNDS.length-1){say("Round complete! Great job!");speak("Round complete! Great job!");$("next").hidden=false;$("hintBtn").hidden=true}
else finish()}
function finish(){
r=ROUNDS.length;stars();$("stage").style.display="none";$("acts").style.display="none";say("");$("hint").textContent="";$("done").style.display="flex";
tone(660,0.15);setTimeout(function(){tone(880,0.15)},150);setTimeout(function(){tone(1100,0.25)},300);speak("You are a Boss Helper!")}
$("next").addEventListener("click",function(){r++;startRound()});
$("again").addEventListener("click",function(){r=0;startRound()});
$("hintBtn").addEventListener("click",function(){
if(locked)return;clearHints();var b=document.querySelector('.opt[data-ok="true"]');if(b){b.classList.add("hint");say("Look at the glowing one!");speak("Look at the glowing one.")}});
$("hear").addEventListener("click",function(){var v=voiceOn;voiceOn=true;speak($("hint").textContent);voiceOn=v});
$("voice").addEventListener("click",function(){voiceOn=!voiceOn;this.textContent=voiceOn?"Voice on":"Voice off";this.setAttribute("aria-pressed",voiceOn);if(!voiceOn){try{window.speechSynthesis.cancel()}catch(e){}}});
startRound();
</script>
</body>
</html>
